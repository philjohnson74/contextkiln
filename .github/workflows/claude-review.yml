name: Claude review

# Automated Claude PR review. The job's result is the `claude-review` status
# check: green on APPROVE, red on REQUEST_CHANGES or when no valid verdict was
# produced. See app_docs/claude-review.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: claude-review
    # Non-draft, same-repo PRs opened by the repo owner only, so secrets never
    # reach fork or third-party PRs.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prepare review context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p .review
          gh pr view "$PR_NUMBER" --repo "$REPO" --json number,title,body,author,headRefName,baseRefName > .review/pr.json
          git diff "$BASE_SHA...$HEAD_SHA" > .review/diff.patch
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > .review/files.txt
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --slurp | jq 'add // []' > .review/comments.json

      - name: Load review prompt
        id: prompt
        run: |
          set -euo pipefail
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "prompt<<$delim"
            cat .claude/commands/review_pr.md
            echo
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            ${{ steps.prompt.outputs.prompt }}

            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
          claude_args: >-
            --model sonnet
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Write,mcp__github_inline_comment__create_inline_comment"

      - uses: astral-sh/setup-uv@v6

      - name: Post verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: uv run adws/review_verdict.py post --review-file .review/review.md --pr "$PR_NUMBER" --repo "$REPO" --comments-file .review/comments.json
